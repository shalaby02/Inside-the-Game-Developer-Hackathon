<title id="t">xT zone values</title>
<desc id="d">Heat map of the 12 by 8 xT zone grid, attacking left to right. Zone values rise from below 0.005 in the team's own half to about 0.30 in the central zones in front of goal, and halve every 8 units further from goal. An arrow shows the 26:01 pass by Femi Oakhurst from zone c6r7 (value 0.0043) to zone c9r4 (value 0.0801).</desc>
