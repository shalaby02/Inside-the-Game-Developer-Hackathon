# Deploys web/ as it is committed to Azure Static Web Apps. No build step:
# web/data/ is built locally with python src/build_site.py and committed.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (the app's
# deployment token from the Azure portal).

name: Deploy web/ to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/azure-static-web-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy web/
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
